
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
        <style>

            @import url('https://fonts.googleapis.com/css2?family=Italiana&display=swap');

            * {
                box-sizing: border-box;
            }

            body {
                font-family: Arial, Helvetica, sans-serif;
            }

            .title {
                font-family: 'Italiana', sans-serif;
                font-size: 25px;
                color: #000;
                width: 35%;
                display: inline-block;
                margin: 0;
            }

            .platform-name {
                font-family: 'Italiana', sans-serif;
                font-weight: bold;
            }

            .info-header {
                font-size: 20px;
                color: #000;
                width: 60%;
                display: inline-block;
                text-align: right;
                margin: 0;
            }
            
            .separator {
                width: 100%;
                height: 2px;
                background-color: #e47b3a;
                margin-top: 10px;
            }

            .hello {
                font-size: 24px;
                color: #000;
                margin-top: 20px;
                text-align: center;
                font-weight: bold;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
                
            }
            td, th {
                border: 1px solid #000;
                padding: 5px;
            }

            th {
                background-color: #eb9c6b;
                color: #fff;
                color: #000;
                font-weight: normal;
            }
        </style>
    </head>
    <body>
        <h1 class="title">Artesanías Bogotá LTD</h1>
        <p class="info-header">
            Factura de tu pedido: <br>
            <strong>{{id}}</strong>
        </p>

        <div class="separator"></div>

        <p class="hello">Hola {{name}}</p>
        <p>Gracias por tu compra en 
            <span class="platform-name">Artesanías Bogotá LTD</span>.
            Aquí tienes los detalles de tu pedido:
        </p>

        <table>
            <thead>
                <tr>
                    <th>
                        Producto
                    </th>
                    <th>
                        Cantidad
                    </th>
                    <th>
                        Valor Unitario
                    </th>
                    <th>
                        Subtotal
                    </th>
                </tr>
            </thead>
            <tbody>
                {{#each products}}
                    <tr>
                        <td>
                            {{name}}
                        </td>
                        <td>
                            {{quantity}}
                        </td>
                        <td>
                            ${{price}}
                        </td>
                        <td style="text-align: right;">
                            ${{subtotal}}
                        </td>
                    </tr>
                {{/each}}
                <tr>
                    <th colspan="3">Total</th>
                    <td style="text-align: right;">${{total}}</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
